name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the created release as pre-release"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # cpu  -> single-file exe (onefile)
        # cuda -> folder archive (onedir; CUDA libs push a single exe past 2 GB)
        include:
          - variant: cpu
            build_mode: onefile
            torch_index: cpu
          - variant: cuda
            build_mode: onedir
            torch_index: cu121

    env:
      WMR_BUILD_MODE: ${{ matrix.build_mode }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-build-${{ matrix.variant }}.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build-${{ matrix.variant }}.txt

      - name: Install UPX (size reduction)
        shell: pwsh
        continue-on-error: true
        run: choco install upx -y --no-progress

      - name: Build executable with PyInstaller
        run: pyinstaller --noconfirm watermark_removal.spec

      - name: Package into zip
        shell: pwsh
        run: |
          $zip = "WatermarkRemover-win64-$env:VARIANT.zip"
          $onefile = "dist/WatermarkRemover.exe"
          $onedir  = "dist/WatermarkRemover"
          if (Test-Path $onefile) {
            Compress-Archive -Path $onefile -DestinationPath $zip -Force
          } elseif (Test-Path $onedir) {
            Compress-Archive -Path $onedir -DestinationPath $zip -Force
          } else {
            throw "No PyInstaller output found (expected $onefile or $onedir)"
          }
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: win64-${{ matrix.variant }}
          path: WatermarkRemover-win64-${{ matrix.variant }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version and release flags
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected assets
        run: ls -lh dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: WatermarkRemover ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*.zip
